name: Build Windows Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name GreekDubAI --collect-all imageio_ffmpeg --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all tokenizers --collect-all pydub app.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: GreekDubAI-Windows-Setup
          path: dist/GreekDubAI_Setup.exe
          if-no-files-found: error
